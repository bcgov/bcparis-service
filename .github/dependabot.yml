version: 2
updates:
  # Mvn dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "18:00"
    # Runtime is Java 8 (eclipse-temurin:8) on Spring Boot 2.7 / javax.
    # Block upgrades that require Java 11+/17 or Jakarta EE; they build but fail at runtime.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.security:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.cloud:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.tomcat.embed:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.slf4j:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ch.qos.logback:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "dev.akkinoc.spring.boot:logback-access-spring-boot-starter"
        update-types: ["version-update:semver-major"]
