name: Build & Vulnerability Scan using Trivy Scanner

on:
  push:
    branches: [ master, release/* ]
  pull_request:
    branches: [ master, release/* ]

permissions:
  contents: read
  security-events: write   # required by github/codeql-action/upload-sarif

jobs:
  build-scan-image:
    name: Build & Scan Image
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      # Set up JDK build environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
        
      # Runs build steps
      - name: Maven Package
        run: mvn -ntp clean package -Popenshift -DskipTests

      # Build Docker image without cache to avoid stale content
      - name: Build Docker image
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1
          CONTEXT: .
        run: |
          docker rmi bc-paris-api:${{ github.sha }} || true
          docker build --no-cache -t bc-paris-api:${{ github.sha }} ${CONTEXT}

      # Confirm image was built successfully
      - name: List Docker images
        run: docker images | grep bc-paris-api

      # Run vulnerability scan using Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'bc-paris-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          scan-ref: '.'
          vuln-type: 'os,library'
          list-all-pkgs: false

      # Upload scan results to GitHub Security tab
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
