apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bc-paris-api-oauth
  name: bc-paris-api-oauth
  namespace: 91beaa-test
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: bc-paris-api-oauth
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: bc-paris-api-oauth
        version: oauth-enabled
    spec:
      containers:
      - env:
        - name: spring_profiles_active
          value: splunk
        - name: ZIPKIN_BASE_URL
          value: http://zipkin-internal:9411/
        envFrom:
        - secretRef:
            name: email-test
        - secretRef:
            name: endpoints-test
        - secretRef:
            name: layer7-test
        - secretRef:
            name: splunk-test
        - secretRef:
            name: rest-endpoints-test
        - secretRef:
            name: icbc-oauth-config-new
        image: image-registry.openshift-image-registry.svc:5000/91beaa-tools/bc-paris-api:oauth
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 70
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: bc-paris-api-oauth
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 50
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 1Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
