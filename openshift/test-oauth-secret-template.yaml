# Test OAuth Secret Template
# DO NOT commit actual credentials to git
# Create this secret in OpenShift before deploying bc-paris-api-oauth

apiVersion: v1
kind: Secret
metadata:
  name: icbc-oauth-config-new
  namespace: 91beaa-test
type: Opaque
stringData:
  ENDPOINT_ICBC_OAUTH_CLIENT_ID: "YOUR_TEST_CLIENT_ID"
  ENDPOINT_ICBC_OAUTH_SECRET: "YOUR_TEST_CLIENT_SECRET"
  ENDPOINT_ICBC_OAUTH_TOKEN_URL: "https://wsgw.jag.gov.bc.ca/icbc-oauth2-token"
  ENDPOINT_ICBC_REST_URL: "https://wsgw.jag.gov.bc.ca/icbc/external/integration/bcag-informationlookup-api/v1/information"
